# BlockSwarm AI Lite example configuration.
# Memory values are starting targets; the governor measures real RSS and
# MemAvailable and reduces concurrency before risking host exhaustion.

home = ".blockswarm"

[governor]
total_physical_ram_target_mib = 8192   # 0 = use the host's real total
target_application_ram_mib   = 5120
minimum_host_headroom_mib    = 1024
default_active_agents        = 2
maximum_active_agents        = 3       # only used when measurements permit
preferred_guest_ram_mib      = 256     # reserved per active agent (Phase 2 microVM size)
model_instances              = 1       # one shared model for all agents
inference_concurrency        = 1       # API requests in flight at once
enforce_limits               = true

[inference]
# Claude through the Anthropic API. Credentials come from the SDK's normal
# resolution (ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN or `ant auth login`),
# never from this file.
backend           = "anthropic"        # anthropic | mock
model             = "claude-opus-5-5"
effort            = "low"              # low | medium | high | xhigh | max
refusal_fallbacks = true               # server-side fallback on safety declines
max_retries       = 2
request_timeout_seconds       = 120
max_context_tokens_per_agent  = 6000   # estimated prompt tokens per request
max_output_tokens_per_request = 2048
token_budget_per_agent_window = 100000
budget_window_seconds         = 3600

[security]
mode            = "dev"                # "secure" refuses to run without microVMs
sandbox_backend = "process"            # inprocess | process | firecracker (secure mode)
gateway         = "inprocess"          # or "unix:/run/blockswarm/gateway.sock" (external process)
policy_file     = "config/policy.example.toml"
process_uid     = 65534                # process sandbox drops to this uid when run as root
process_memory_mib     = 1024          # process sandbox address-space cap
max_rpc_calls_per_task = 32
capability_ttl_seconds = 300
envelope_ttl_seconds   = 300
max_agent_failures     = 3
task_timeout_seconds   = 180
lease_seconds          = 240

[firecracker]                          # used when sandbox_backend = "firecracker"
firecracker_bin = "/usr/local/bin/firecracker"
jailer_bin      = "/usr/local/bin/jailer"
kernel_image    = "/var/lib/blockswarm/vmlinux"            # scripts/build_guest_image.sh
rootfs_image    = "/var/lib/blockswarm/guest-rootfs.ext4"  # attached read-only
chroot_base     = "/srv/blockswarm-jail"
uid = 65534
gid = 65534
vcpus           = 1
guest_mem_mib   = 256
vmm_overhead_mib = 64                  # cgroup memory limit = guest + overhead
cpu_quota_pct   = 100                  # % of one CPU
pids_max        = 64
cgroup_version  = 2                    # 1 on cgroup-v1 hosts
vsock_port      = 5000
boot_timeout_seconds = 30

[ledger]
backend    = "simulated"               # local hash-chained log; NO consensus
batch_size = 16

[api]
host = "127.0.0.1"
port = 8787
